# Gitleaks configuration extending default rules with narrow allowlists.
# Pinned version: v8.30.1

[extend]
useDefault = true

[[allowlists]]
description = "Allowlist SHA-256 checksum fields in data/facts JSON files"
condition = "AND"
regexTarget = "line"
paths = [
    '''data/facts/.*\.json''',
]
regexes = [
    '''"[a-zA-Z0-9_]*sha256[a-zA-Z0-9_]*"\s*:\s*"[a-fA-F0-9]{64}"''',
]
