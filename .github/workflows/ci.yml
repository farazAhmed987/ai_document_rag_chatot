name: Backend Quality

on:
  push:
    branches:
      - main
      - "phase-*"
      - hardening
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -e backend
      - name: Ruff lint backend and scripts
        run: ruff check backend scripts
      - name: Ruff format backend and scripts
        run: ruff format --check backend scripts
      - name: Strict backend typing
        working-directory: backend
        run: mypy app
      - name: Tests including committed sample PDFs
        working-directory: backend
        run: pytest -m "not db"
      - name: Pre-commit
        run: pre-commit run --all-files
      - name: Protected file integrity
        run: |
          test -z "$(git status --porcelain -- data eval docs/SRD.md context README.md)"
