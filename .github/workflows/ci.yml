name: Backend Quality

on:
  push:
    branches:
      - main
      - "phase-*"
      - hardening
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Gitleaks repository secret scan
        run: gitleaks git --redact -v
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -e backend
      - name: Ruff lint backend and scripts
        run: ruff check backend scripts
      - name: Ruff format backend and scripts
        run: ruff format --check backend scripts
      - name: Strict backend typing
        working-directory: backend
        run: mypy app
      - name: Tests including committed sample PDFs
        working-directory: backend
        run: |
          set -o pipefail
          pytest -m "not db and not model" --cov=app --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=88 -v 2>&1 | tee /tmp/pytest_out.txt || {
            tail -n 10 /tmp/pytest_out.txt | while IFS= read -r line; do
              echo "::error title=PytestEnd::$line"
            done
            exit 1
          }
      - name: Phase module coverage
        working-directory: backend
        run: >-
          python ../scripts/check_phase_coverage.py coverage.json
          --module app/services/chunking.py
          --module app/schemas/chunking.py
          --module app/adapters/tokenizers/bge_m3.py
          --module app/adapters/embedders/base.py
          --module app/adapters/embedders/fake.py
          --module app/adapters/embedders/factory.py
          --module app/adapters/embedders/bge_m3.py
          --module app/services/ingestion.py
          --module app/adapters/storage/base.py
          --module app/adapters/storage/local.py
          --module app/repositories/chunk.py
          --module app/core/ingest_errors.py
          --module app/cli.py
          --module app/schemas/retrieval.py
          --module app/adapters/rerankers/base.py
          --module app/adapters/rerankers/fake.py
          --module app/adapters/rerankers/factory.py
          --module app/adapters/rerankers/bge_reranker.py
          --module app/services/retrieval.py
          --module app/repositories/retrieval.py
      - name: Pre-commit
        run: pre-commit run --all-files
      - name: Protected file integrity
        run: |
          test -z "$(git status --porcelain -- data eval docs/SRD.md context README.md)"
