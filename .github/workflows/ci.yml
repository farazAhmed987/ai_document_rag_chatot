name: Backend Quality

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Ruff, mypy, pytest, pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go for gitleaks pre-commit hook
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -e backend

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Strict type checking
        working-directory: backend
        run: mypy app

      - name: Unit tests without external dependencies
        working-directory: backend
        run: pytest -m "not db and not sample"

      - name: Pre-commit checks
        run: pre-commit run --all-files

      - name: Verify protected files were not modified
        run: |
          if [ -n "$(git status --porcelain -- data eval docs/SRD.md context README.md)" ]; then
            git status --short -- data eval docs/SRD.md context README.md
            exit 1
          fi

      - name: Scan repository history for secrets
        run: |
          pre-commit run gitleaks --all-files
